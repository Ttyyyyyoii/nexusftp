<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Gestion des routes Vue.js (Single Page Application)
        FallbackResource /index.html
    </Directory>

    # Rediriger favicon.ico vers favicon.svg (évite le 404)
    Redirect 301 /favicon.ico /favicon.svg

    # Le dossier /api/ est géré par PHP
    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Désactiver le fallback Vue.js pour les requêtes API
        FallbackResource disabled
    </Directory>

    # Désactiver le fallback pour les assets statiques
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp|xml|txt)$">
        FallbackResource disabled
    </LocationMatch>

    # Headers de performance et sécurité
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
