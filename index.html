  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexusFTP" />
    <meta name="description" content="NexusFTP - Client FTP/SFTP/FTPS Premium dans votre navigateur. Transférez vos fichiers vers n'importe quel serveur en ligne et de manière sécurisée." />
    <meta name="keywords" content="client FTP en ligne, client SFTP, transfert de fichiers, web FTP, NexusFTP, FTPS, SSH, serveur FTP" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:description" content="Gérez et transférez vos fichiers serveur directement depuis votre navigateur avec une interface moderne et sécurisée." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexusFTP - Client FTP & SFTP Premium" />
    <meta name="twitter:description" content="Gérez et transférez vos fichiers serveur directement depuis votre navigateur avec une interface moderne et sécurisée." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Google Search Console -->
    <meta name="google-site-verification" content="dxnHD6TKks8ehhTdicMNn7z93QYHin8rchp1F0fEiRY" />

    <meta name="theme-color" content="#6366f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>NexusFTP - Client FTP & SFTP Premium En Ligne</title>
  </head>
  <body>
    <!-- ✨ Splash screen natif (visible avant que Vue charge) -->
    <div id="splash-screen" aria-hidden="true">
      <div class="splash-content">
        <div class="splash-logo">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="16" fill="url(#splashGrad)"/>
            <path d="M16 40 L32 20 L48 40" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M24 40 L32 28 L40 40" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
            <path d="M20 44 L44 44" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <defs>
              <linearGradient id="splashGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="splash-title">NexusFTP</h1>
        <p class="splash-subtitle">Client FTP &amp; SFTP Premium</p>
        <div class="splash-loader">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #0f0f23;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash-screen.hidden { opacity: 0; visibility: hidden; }
      .splash-content {
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        animation: splashFadeIn 0.6s ease;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .splash-logo {
        width: 80px; height: 80px;
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(99,102,241,0.5), 0 0 120px rgba(139,92,246,0.2);
        animation: splashPulse 2s ease-in-out infinite;
      }
      .splash-logo svg { width: 80px; height: 80px; }
      @keyframes splashPulse {
        0%, 100% { box-shadow: 0 0 40px rgba(99,102,241,0.4), 0 0 80px rgba(139,92,246,0.1); }
        50%       { box-shadow: 0 0 80px rgba(99,102,241,0.7), 0 0 160px rgba(139,92,246,0.3); }
      }
      .splash-title {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; margin: 0;
      }
      .splash-subtitle {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px; color: #6366f1; font-weight: 500;
        letter-spacing: 0.05em; text-transform: uppercase; margin: 0;
      }
      .splash-loader {
        width: 160px; height: 3px;
        background: rgba(99,102,241,0.2); border-radius: 99px;
        overflow: hidden; margin-top: 8px;
      }
      .splash-bar {
        height: 100%; width: 40%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
        background-size: 200% 100%;
        border-radius: 99px;
        animation: splashSlide 1.4s ease-in-out infinite, splashShimmer 1.4s linear infinite;
      }
      @keyframes splashSlide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes splashShimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
